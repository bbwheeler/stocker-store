apiVersion: v1
kind: ConfigMap
metadata:
  name: stocker-store-config
  namespace: stocker
  labels:
    app.kubernetes.io/name: stocker-store
    app.kubernetes.io/part-of: stocker
data:
  GRPC_PORT: "3500"
  STOCK_TTL: 720h
  RABBITMQ_EXCHANGE: stock.update
  RABBITMQ_EXCHANGE_TYPE: topic
  RABBITMQ_ROUTING_KEY: stock.update.v1
  RABBITMQ_QUEUE: stocker-store.stock.update.v1
  RABBITMQ_PREFETCH: "1"
