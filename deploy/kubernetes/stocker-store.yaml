apiVersion: v1
kind: Namespace
metadata:
  name: stocker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stocker-store-config
  namespace: stocker
data:
  GRPC_PORT: "3500"
  STOCK_TTL: 720h
  RABBITMQ_EXCHANGE: stocker
  RABBITMQ_EXCHANGE_TYPE: topic
  RABBITMQ_ROUTING_KEY: stock.update.v1.#
  RABBITMQ_QUEUE: stock.update.v1.store
  RABBITMQ_PREFETCH: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocker-store
  namespace: stocker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stocker-store
  template:
    metadata:
      labels:
        app: stocker-store
    spec:
      containers:
        - name: stocker-store
          image: git.wheeli.ca/brian/stocker-store:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 3500
          envFrom:
            - configMapRef:
                name: stocker-store-config
            - secretRef:
                name: stocker-store-env
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stocker-store
  namespace: stocker
spec:
  type: ClusterIP
  selector:
    app: stocker-store
  ports:
    - name: grpc
      port: 3500
      targetPort: grpc
